<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Flow — a fluid whiteboard for online tutoring." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <title>Flow</title>
    <style>
      /* Launch state: shown until React mounts, then replaced. */
      .launch { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f2f2f7; }
      .launch img { width: 96px; height: 96px; animation: launch-in 600ms cubic-bezier(0.32, 0.72, 0, 1) both; filter: drop-shadow(0 10px 24px rgba(255, 96, 131, 0.28)); }
      @keyframes launch-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
      @media (prefers-color-scheme: dark) { .launch { background: #000; } }
      @media (prefers-reduced-motion: reduce) { .launch img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="launch" aria-hidden="true"><picture><source srcset="/logo-dark-192.png" media="(prefers-color-scheme: dark)" /><img src="/logo-192.png" alt="" /></picture></div></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
