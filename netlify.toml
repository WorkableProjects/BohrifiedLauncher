# Netlify: build the launcher + apps into dist/ and serve it as a static site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Launcher routes (/app/<id>) are client-side: serve the shell for them.
# App pages under /apps/* are real files and are served as-is.
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Join Whiteboard: /join and /join/<CODE> are client-side routes too.
[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/join/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes: cache it for a year. Everything else keeps
# Netlify's default (max-age=0, must-revalidate), so new deploys show up at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apps/flow/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Apps run in same-origin frames inside the launcher; nobody else may frame them.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
